server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Access-Control-Allow-Origin *;
    }

    # remoteEntry.js and chunks need CORS so remote MFEs can be loaded
    # cross-origin from other hosts/ports.
    location ~* \.js$ {
        add_header Access-Control-Allow-Origin *;
    }
}
