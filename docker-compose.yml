version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: appdb
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-bootstrap:
    image: minio/mc:latest
    container_name: minio-bootstrap
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/mfe-assets &&
      mc anonymous set download local/mfe-assets &&
      echo 'MinIO bucket mfe-assets ready'
      "

  product-service:
    build:
      context: .
      dockerfile: backend/product-service/Dockerfile
    container_name: product-service
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/appdb?schema=product_schema
      SPRING_R2DBC_USERNAME: product_service
      SPRING_R2DBC_PASSWORD: product_service_pwd
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/microfrontend-demo
      SERVER_PORT: 8081
    ports:
      - "8081:8081"

  order-service:
    build:
      context: .
      dockerfile: backend/order-service/Dockerfile
    container_name: order-service
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      product-service:
        condition: service_started
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/appdb?schema=order_schema
      SPRING_R2DBC_USERNAME: order_service
      SPRING_R2DBC_PASSWORD: order_service_pwd
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/microfrontend-demo
      PRODUCT_SERVICE_GRAPHQL_URL: http://product-service:8081/graphql
      SERVER_PORT: 8082
    ports:
      - "8082:8082"

  # Extends product-service's Product entity with an `inventory` field —
  # the canonical Apollo Federation "subgraph attaching a field to an
  # entity it doesn't own" pattern. See
  # backend/inventory-service/.../ProductInventoryResolver.java and
  # infra/apollo-router/inventory.graphql.
  inventory-service:
    build:
      context: .
      dockerfile: backend/inventory-service/Dockerfile
    container_name: inventory-service
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/appdb?schema=inventory_schema
      SPRING_R2DBC_USERNAME: inventory_service
      SPRING_R2DBC_PASSWORD: inventory_service_pwd
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/microfrontend-demo
      SERVER_PORT: 8083
    ports:
      - "8083:8083"

  # ---------------------------------------------------------------------
  # Federation layer: rover composes all three subgraphs' STATIC SDL
  # files (product.graphql/order.graphql/inventory.graphql, kept in sync
  # by hand with each service's real schema.graphqls) into ONE
  # supergraph.graphql — an offline step, NOT done by Router itself.
  # Apollo Router then loads that file and does the actual federation
  # query planning/parallel subgraph execution at request time. See
  # infra/apollo-router/ for all the config files. File-based composition
  # means this doesn't need product-service/order-service/
  # inventory-service to be running at all to compose — it runs
  # immediately, in parallel with them starting up.
  # ---------------------------------------------------------------------
  supergraph-compose:
    build:
      context: ./infra/apollo-router/rover-compose
    container_name: supergraph-compose
    volumes:
      - ./infra/apollo-router/supergraph-config.yaml:/workspace/supergraph-config.yaml:ro
      - ./infra/apollo-router/product.graphql:/workspace/product.graphql:ro
      - ./infra/apollo-router/order.graphql:/workspace/order.graphql:ro
      - ./infra/apollo-router/inventory.graphql:/workspace/inventory.graphql:ro
      - supergraph-schema:/output

  apollo-router:
    image: ghcr.io/apollographql/router:v1.59.2
    container_name: apollo-router
    depends_on:
      supergraph-compose:
        condition: service_completed_successfully
    volumes:
      - supergraph-schema:/dist/schema
      - ./infra/apollo-router/router.yaml:/dist/config/router.yaml:ro
    command: ["-c", "config/router.yaml", "-s", "schema/supergraph.graphql", "--log", "info"]
    ports:
      - "4000:4000"

  shell:
    build:
      context: ./frontend
      dockerfile: shell/Dockerfile
    container_name: mfe-shell
    ports:
      - "3000:3000"
    environment:
      KEYCLOAK_URL: http://localhost:8080
      PRODUCTS_REMOTE_URL: http://localhost:3001/remoteEntry.js
      ORDERS_REMOTE_URL: http://localhost:3002/remoteEntry.js

  # No PRODUCT_GRAPHQL_URL/ORDER_GRAPHQL_URL here (or below): those were
  # already dead — this `environment:` block only affects the RUNNING
  # container, but the GraphQL URL is baked into the JS bundle at IMAGE
  # BUILD time via config.js's APP_ENV-selected block (see
  # frontend/shared-auth/src/config.js's "local" entry: graphqlUrl points
  # directly at apollo-router on :4000 — no separate gateway needed).
  mfe-products:
    build:
      context: ./frontend
      dockerfile: mfe-products/Dockerfile
    container_name: mfe-products
    ports:
      - "3001:3001"

  mfe-orders:
    build:
      context: ./frontend
      dockerfile: mfe-orders/Dockerfile
    container_name: mfe-orders
    ports:
      - "3002:3002"

volumes:
  pgdata:
  miniodata:
  supergraph-schema:
