  # Extends product-service's Product entity with a `rating` field —
  # GENUINELY 1:1 (contrast with inventory's 1:many). See
  # backend/rating-service/.../ProductRatingResolver.java and
  # infra/apollo-router/rating.graphql.
#  rating-service:
#    build:
#      context: .
#      dockerfile: backend/rating-service/Dockerfile
#    container_name: rating-service-qa
#    depends_on:
