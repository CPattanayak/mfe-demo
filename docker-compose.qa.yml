version: "3.8"

# QA topology. Differences from the local docker-compose.yml:
#  - No MinIO: static assets are served by a CDN-style nginx edge (./cdn)
#    with real immutable-asset caching, gzip, and content-hashed filenames
#    — much closer to what CloudFront/Cloud CDN/Cloudflare would front in
#    a hosted environment than a raw MinIO bucket is.
#  - shell/mfe-products/mfe-orders are no longer three separate dev
#    containers; they're built once into the single `cdn` image, the way
#    they'd actually be published by CI for a shared QA environment.
#  - Backend services get healthchecks and restart policies, since QA is
#    meant to be a shared, longer-lived environment, not a throwaway dev box.
#  - Federated: product-service and order-service are real Apollo
#    Federation subgraphs (see backend/*/config/FederationConfig.java).
#    supergraph-compose runs `rover supergraph compose` once at startup
#    (from static SDL files, not live introspection — see
#    infra/apollo-router/supergraph-config.yaml) to combine both
#    subgraphs' schemas, and Apollo Router loads the result and does the
#    actual federation query planning/parallel execution. `cdn`'s nginx
#    (see cdn/nginx.conf) is the ONE endpoint the browser talks to for
#    everything — GraphQL and Keycloak auth are reverse-proxied straight
#    through to Router/Keycloak internally, alongside serving the UI
#    itself. No separate gateway service — nginx already has to be there
#    to serve the UI, and it does the identical path-routing a
#    dedicated gateway app would, for a fraction of the resource cost.
#    Only `cdn` publishes a host port now; every other service is
#    reachable only on the Docker network.
#
# Usage:
#   docker compose -f docker-compose.qa.yml up -d --build
#
# For a real cloud CDN in front of this same origin, point
# CloudFront/Cloud CDN/Cloudflare at cdn's public endpoint (or, better, at
# an S3/GCS bucket populated by your CI build — see
# scripts/publish-to-minio.sh for the analogous local pattern) instead of
# hitting nginx's own cache directly from the internet.
#
# NOTE on APP_ENV: the `cdn` build below sets APP_ENV=qa, which bakes in
# frontend/shared-auth/src/config.js's "qa" block (placeholder
# https://qa-*.example.com URLs) into the bundle — the same thing a real CI
# pipeline would do for an actual QA deploy. If you're just smoke-testing
# this compose file's container topology on your own machine, either edit
# that "qa" block to point at localhost:9000 (the gateway) first, or
# override `args.APP_ENV: local` below to use the local block instead.

services:
  postgres:
    image: postgres:16-alpine
    container_name: appdb-qa
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${QA_POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata-qa:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: keycloak-qa
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${QA_KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      # Needed now that cdn's nginx proxies /realms/** to this container
      # (see cdn/nginx.conf): without telling Keycloak its PUBLIC-facing
      # hostname, it can generate redirect/token URLs pointing at its own
      # internal container address instead of the public one, breaking
      # login. Set this to your real public hostname for an actual QA
      # deployment (the config.js "qa" block's keycloakUrl origin) —
      # left unset by default here since this compose file's QA block is
      # placeholder example.com URLs, not meant to resolve directly.
      KC_HOSTNAME: ${QA_PUBLIC_HOSTNAME:-}
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8080:8080"
    restart: unless-stopped

