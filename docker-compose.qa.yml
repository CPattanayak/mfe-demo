  # Backs Hive Gateway's response caching — see docker-compose.yml's
  # identical comment.
  redis:
    image: redis:7-alpine
    container_name: redis-qa
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Federation layer — same mechanism as local docker-compose.yml, see
  # those service comments for the full explanation.
  # ---------------------------------------------------------------------
  supergraph-compose:
    build:
      context: ./infra/apollo-router/rover-compose
    container_name: supergraph-compose-qa
    volumes:
      - ./infra/apollo-router/supergraph-config.yaml:/workspace/supergraph-config.yaml:ro
      - ./infra/apollo-router/product.graphql:/workspace/product.graphql:ro
      - ./infra/apollo-router/order.graphql:/workspace/order.graphql:ro
      - ./infra/apollo-router/inventory.graphql:/workspace/inventory.graphql:ro
      - ./infra/apollo-router/rating.graphql:/workspace/rating.graphql:ro
      - supergraph-schema-qa:/output

  # Replaces Apollo Router — see docker-compose.yml's identical comment.
  # QA ONLY — single-node Kafka in KRaft mode (no Zookeeper needed),
  # backing infra/hive-gateway/plugins/kafkaMutationNotifier.ts. Config
  # below is a well-established, cross-referenced pattern for
  # single-node KRaft (confirmed consistent across many independent
  # sources, not a single unverified guess) — CLUSTER_ID is just an
  # arbitrary valid base64-style string (this exact placeholder value
  # appears in multiple independent Kafka KRaft tutorials), not
  # anything project-specific.
  kafka:
    image: apache/kafka:latest
    container_name: kafka-qa
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Simplifies testing — the notifier plugin doesn't need to
      # pre-create "graphql-mutations" itself.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      - "9092:9092"
    restart: unless-stopped

  # Web UI to browse actual Kafka messages (including headers — the
  # mutation-name header kafkaMutationNotifier.ts sets), topics, and
  # consumer groups — a real alternative to the
  # kafka-console-consumer.sh CLI command suggested earlier in this
  # project. Config CONFIRMED consistent across many independent
  # sources including the provectus/kafka-ui project's own official
  # example compose file.
  #
  # Port 8087 host-side — checked against every other port already in
  # use in this file first (8080 is keycloak's, 8081-8084 are the four
  # backend services', 8000/8085 are apollo-mcp-server's/
  # ai-gateway-service's, 8090 is cdn's, 9092 is kafka's own) — 8087
  # was free.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui-qa
    depends_on:
      kafka:
        condition: service_started
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8087:8080"
    restart: unless-stopped

  hive-gateway:
    # Custom-built, not pulled — see infra/hive-gateway/Dockerfile's own
    # comment: a plugin using an external npm package (kafkajs) needs
    # this, confirmed via Hive Gateway's own Docker deployment guide.
    build:
      context: ./infra/hive-gateway
    container_name: hive-gateway-qa
    depends_on:
      supergraph-compose:
        condition: service_completed_successfully
      redis:
        condition: service_started
      kafka:
        condition: service_started
    volumes:
      - supergraph-schema-qa:/supergraph
      - ./infra/hive-gateway/gateway.config.ts:/gateway/gateway.config.ts:ro
      - ./infra/hive-gateway/plugins:/gateway/plugins:ro
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_MUTATION_TOPIC: graphql-mutations
      # Flip to "false" to verify the hook fires (check logs for
      # "[kafka-mutation-notifier] hook fired...") WITHOUT needing
      # Kafka publish to succeed — see the plugin's own comment.
      KAFKA_MUTATION_NOTIFIER_ENABLED: "true"
    # --host 0.0.0.0 — see docker-compose.yml's identical comment for
    # why this isn't redundant with the documented CLI default.
    command: ["supergraph", "--host", "0.0.0.0"]
    restart: unless-stopped

  # Scrapes hive-gateway's /metrics endpoint (enabled via that
  # service's own gateway.config.ts prometheus: {...} block). Standard,
  # official Prometheus image and config format.
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-qa
    depends_on:
      hive-gateway:
        condition: service_started
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  # Visualizes what Prometheus collects. Prometheus datasource is
  # auto-provisioned (infra/grafana/provisioning/datasources/) — no
  # manual UI setup needed for that part. The actual Hive Gateway
  # dashboard needs a one-time import — see
  # infra/grafana/dashboards/README.md for exactly why that step isn't
  # automated here.
  grafana:
    image: grafana/grafana:latest
    container_name: grafana-qa
    depends_on:
      prometheus:
        condition: service_started
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      # QA-only convenience default — change before anything beyond
      # local/QA use.
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    restart: unless-stopped

  # Exposes hand-written GraphQL operations as MCP tools — see
  # docker-compose.yml's identical comment. Directly exposed on its own
  # port (unlike hive-gateway above, which relies entirely on cdn's
  # nginx reverse-proxy) because MCP clients are AI agent tooling, not
  # browser traffic going through the same /graphql path the web UI
  # uses — there's no existing nginx location block for MCP's SSE
  # protocol, and adding one wouldn't make much sense given the
  # different access pattern.
  apollo-mcp-server:
    image: ghcr.io/apollographql/apollo-mcp-server:v1.8.0
    container_name: apollo-mcp-server-qa
    depends_on:
      hive-gateway:
        condition: service_started
    volumes:
      - ./infra/apollo-mcp-server/config.yaml:/config.yaml:ro
      - ./infra/apollo-mcp-server/operations:/mcp-operations:ro
      - supergraph-schema-qa:/supergraph:ro
    command: ["/config.yaml"]
    ports:
      - "8000:8000"
    restart: unless-stopped

  # AI-agent operations only — see docker-compose.yml's identical
  # comment.
#  ai-gateway-service:
#    build:
#      context: ./backend/ai-gateway-service
#    container_name: ai-gateway-service-qa
#    depends_on:
#      # NOT hive-gateway — see docker-compose.yml's identical comment.
#      apollo-mcp-server:
#        condition: service_started
#    environment:
#      KEYCLOAK_ISSUER: http://localhost:8080/realms/microfrontend-demo
#      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/realms/microfrontend-demo
#      KEYCLOAK_CLIENT_ID: web-app
#      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
#      OPENROUTER_MODEL: openai/gpt-4o-mini
#    ports:
#      - "8085:8000"
#    restart: unless-stopped

  # Requirement: CDN-style deployment for QA (replaces MinIO from the local
  # docker-compose.yml). Serves shell at /, mfe-products at /products/,
  # mfe-orders at /orders/ — AND is the single entry point for
  # everything else too: /graphql and /realms/** are reverse-proxied
  # straight through to hive-gateway/keycloak by nginx itself (see
  # cdn/nginx.conf). No separate gateway service — a whole
  # JVM app doing nothing but static path routing wasn't justified once
  # nginx (already required here to serve the UI) does the identical
  # routing for free.
  cdn:
    build:
      context: .
      dockerfile: cdn/Dockerfile
      args:
        CDN_PUBLIC_PATH: /
        PRODUCTS_REMOTE_URL: /products/remoteEntry.js
        ORDERS_REMOTE_URL: /orders/remoteEntry.js
        APP_ENV: qa
    container_name: cdn-qa
    depends_on:
      hive-gateway:
        condition: service_started
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "8090:8090"
    restart: unless-stopped

volumes:
  pgdata-qa:
  supergraph-schema-qa:
