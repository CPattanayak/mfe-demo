# CDN-style edge config: aggressive immutable caching on content-hashed
# assets, no caching on things that must always be fresh, gzip enabled,
# and a debug header so you can see cache behaviour from curl -I.
#
# This is ALSO the single entry point for everything else the browser
# talks to — GraphQL (proxied to Hive Gateway) and Keycloak auth
# (proxied to Keycloak) — so there's no separate application gateway
# service. A whole JVM/Node app doing nothing but static path-prefix
# routing was unjustifiable overhead once nginx (already required here
# to serve the UI) can do the identical routing in a few `location`
# blocks, at a fraction of the memory/startup cost.
upstream hive_gateway {
    server hive-gateway:4000;
}

upstream keycloak {
    server keycloak:8080;
}

server {
    listen 8090;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    add_header X-CDN-Node "cdn-edge-nginx" always;
    add_header Access-Control-Allow-Origin * always;

    # GraphQL — proxied straight through to Hive Gateway, which does the
    # actual federation query planning/parallel subgraph execution and
    # response caching (see infra/hive-gateway/gateway.config.ts).
    # Gateway's own CORS config stays permissive as a fallback for direct
    # access, but requests arriving via THIS path are same-origin from
    # the browser's perspective (same host:port as the UI), so CORS
    # mostly doesn't even come into play here.
    location /graphql {
        proxy_pass http://hive_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Authorization is forwarded automatically by proxy_pass (nginx
        # doesn't strip it) — Hive Gateway then propagates it on to every
        # subgraph per gateway.config.ts's propagateHeaders config.
    }

    # Keycloak's login pages, token endpoint, etc. all live under
    # /realms/{realm}/... — proxying just that prefix is enough for the
    # browser-redirect login flow shared-auth/authClient.js uses.
    location /realms/ {
        proxy_pass http://keycloak;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # remoteEntry.js is the Module Federation manifest — it must be fetched
    # fresh every time so shell always finds the latest exposed modules.
    location ~* remoteEntry\.js$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Cache-Status "BYPASS" always;
    }

    # index.html (shell + each remote's standalone dev entry) must also
    # always be revalidated — it's what points at today's hashed bundles.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Cache-Status "BYPASS" always;
    }

    # Content-hashed JS/CSS chunks are safe to cache forever: a new deploy
    # always produces a new filename (see webpack.config.js contenthash).
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Cache-Status "HIT" always;
    }

    location ~* \.(?:png|jpg|jpeg|gif|svg|woff2?|ttf|eot|ico)$ {
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Cache-Status "HIT" always;
    }

    # shell at /, mfe-products at /products/, mfe-orders at /orders/
    location /products/ {
        alias /usr/share/nginx/html/products/;
        try_files $uri $uri/ /products/index.html;
    }

    location /orders/ {
        alias /usr/share/nginx/html/orders/;
        try_files $uri $uri/ /orders/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
