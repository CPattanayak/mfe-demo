---
# Extends product-service's Product entity with an `inventory` field —
# see backend/inventory-service/.../ProductInventoryResolver.java and
# infra/apollo-router/inventory.graphql. Owns no entity itself, has no
# dependency on product-service/order-service being up first (federation
# entity extension is resolved by Apollo Router at query time, not at
# this pod's startup).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: mfe-demo
spec:
  replicas: 2
  selector:
    matchLabels: { app: inventory-service }
  template:
    metadata:
      labels: { app: inventory-service }
    spec:
      containers:
        - name: inventory-service
          image: ghcr.io/your-org/inventory-service:latest
          ports: [{ containerPort: 8083 }]
          env:
            - { name: SPRING_R2DBC_URL, value: "r2dbc:postgresql://postgres:5432/appdb?schema=inventory_schema" }
            - { name: SPRING_R2DBC_USERNAME, value: "inventory_service" }
            - name: SPRING_R2DBC_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: INVENTORY_SERVICE_DB_PASSWORD } }
            - { name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI, value: "http://keycloak:8080/realms/microfrontend-demo" }
            - { name: SERVER_PORT, value: "8083" }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8083 }
            initialDelaySeconds: 15
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits: { cpu: "1", memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: mfe-demo
spec:
  selector: { app: inventory-service }
  ports: [{ port: 8083, targetPort: 8083 }]
---
