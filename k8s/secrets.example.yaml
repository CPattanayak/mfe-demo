# Copy this file, fill in real values, and apply BEFORE the other manifests.
# Do not commit the filled-in version.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: mfe-demo
type: Opaque
stringData:
  POSTGRES_DB: appdb
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: CHANGE_ME
  PRODUCT_SERVICE_DB_PASSWORD: CHANGE_ME
  ORDER_SERVICE_DB_PASSWORD: CHANGE_ME
  INVENTORY_SERVICE_DB_PASSWORD: CHANGE_ME
  RATING_SERVICE_DB_PASSWORD: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin
  namespace: mfe-demo
type: Opaque
stringData:
  KEYCLOAK_ADMIN: admin
  KEYCLOAK_ADMIN_PASSWORD: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: mfe-demo
type: Opaque
stringData:
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: openrouter-credentials
  namespace: mfe-demo
type: Opaque
stringData:
  # Powers ai-gateway-service's LangGraph agent — see
  # k8s/qa/secrets.example.yaml's identical block.
  OPENROUTER_API_KEY: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-credentials
  namespace: mfe-demo
type: Opaque
stringData:
  GF_SECURITY_ADMIN_PASSWORD: CHANGE_ME
