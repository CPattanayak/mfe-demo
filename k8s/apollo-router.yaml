# Federation layer for production. An initContainer runs `rover
# supergraph compose` (same static-SDL-file approach as
# docker-compose.qa.yml — see infra/apollo-router/) into a shared
# emptyDir volume before the main apollo-router container starts. This
# recomposes fresh on every pod (re)start rather than relying on a
# separate one-off Job that could go stale relative to whatever image
# versions are actually running.
apiVersion: v1
kind: ConfigMap
metadata:
  name: apollo-router-config
  namespace: mfe-demo
data:
  # Populate via (keeps this file DRY and always in sync with the real
  # repo files, rather than a second copy pasted into this YAML):
  #   kubectl create configmap apollo-router-config \
  #     --from-file=router.yaml=infra/apollo-router/router.yaml \
  #     --from-file=supergraph-config.yaml=infra/apollo-router/supergraph-config.yaml \
  #     --from-file=product.graphql=infra/apollo-router/product.graphql \
  #     --from-file=order.graphql=infra/apollo-router/order.graphql \
  #     --from-file=inventory.graphql=infra/apollo-router/inventory.graphql \
  #     --from-file=rating.graphql=infra/apollo-router/rating.graphql \
  #     -n mfe-demo --dry-run=client -o yaml | kubectl apply -f -
  router.yaml: "placeholder"
  supergraph-config.yaml: "placeholder"
  product.graphql: "placeholder"
  order.graphql: "placeholder"
  inventory.graphql: "placeholder"
  rating.graphql: "placeholder"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apollo-router
  namespace: mfe-demo
spec:
  replicas: 2
  selector:
    matchLabels: { app: apollo-router }
  template:
    metadata:
      labels: { app: apollo-router }
    spec:
      initContainers:
        - name: supergraph-compose
          # Built from infra/apollo-router/rover-compose/Dockerfile
          image: ghcr.io/your-org/rover-compose:latest
          volumeMounts:
            - { name: router-config, mountPath: /workspace/supergraph-config.yaml, subPath: supergraph-config.yaml }
            - { name: router-config, mountPath: /workspace/product.graphql, subPath: product.graphql }
            - { name: router-config, mountPath: /workspace/order.graphql, subPath: order.graphql }
            - { name: router-config, mountPath: /workspace/inventory.graphql, subPath: inventory.graphql }
            - { name: router-config, mountPath: /workspace/rating.graphql, subPath: rating.graphql }
            - { name: supergraph-output, mountPath: /output }
      containers:
        - name: apollo-router
          image: ghcr.io/apollographql/router:v1.59.2
          args: ["-c", "/config/router.yaml", "-s", "/schema/supergraph.graphql", "--log", "info"]
          ports: [{ containerPort: 4000 }]
          volumeMounts:
            - { name: router-config, mountPath: /config/router.yaml, subPath: router.yaml }
            - { name: supergraph-output, mountPath: /schema }
          # tcpSocket rather than httpGet against Router's separate health
          # port (8088): confirmed via actual container logs that Router
          # binds that health endpoint to 127.0.0.1 only — unreachable by
          # kubelet's probe, which connects via the Pod IP, not the
          # container's own loopback. Port 4000 (the actual GraphQL
          # endpoint) IS confirmed bound to 0.0.0.0, so this is the
          # reliable, already-proven-working choice rather than a
          # httpGet probe against a port that's known not to work as-is.
          readinessProbe:
            tcpSocket: { port: 4000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
      volumes:
        - name: router-config
          configMap: { name: apollo-router-config }
        - name: supergraph-output
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: apollo-router
  namespace: mfe-demo
spec:
  selector: { app: apollo-router }
  ports: [{ port: 4000, targetPort: 4000 }]
