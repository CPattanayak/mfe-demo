apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: mfe-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: keycloak }
  template:
    metadata:
      labels: { app: keycloak }
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:25.0
          # In prod, drop --import-realm after first boot, or manage the
          # realm declaratively via Keycloak's Admin REST API / Terraform.
          args: ["start", "--optimized", "--proxy=edge", "--hostname-strict=false"]
          envFrom:
            - secretRef: { name: keycloak-admin }
          env:
            - { name: KC_DB, value: postgres }
            - { name: KC_DB_URL, value: "jdbc:postgresql://postgres:5432/appdb" }
            - { name: KC_DB_USERNAME, valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_USER } } }
            - { name: KC_DB_PASSWORD, valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_PASSWORD } } }
            # Must match the actual public host in ingress.yaml AND
            # config.js's resolved keycloakUrl (window.location.origin at
            # runtime — see that file's comment). cdn's nginx proxies
            # /realms/** here (see cdn/nginx.conf); without this,
            # Keycloak generates redirect/token URLs pointing at its own
            # internal cluster address instead of the public one it's
            # actually reachable at, breaking login. Same fix already
            # applied to k8s/qa/keycloak.yaml, for the same reason.
            - { name: KC_HOSTNAME, value: "app.example.com" }
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /health/ready, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: mfe-demo
spec:
  selector: { app: keycloak }
  ports: [{ port: 8080, targetPort: 8080 }]
