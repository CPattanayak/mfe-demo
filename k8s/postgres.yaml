apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: mfe-demo
data:
  init.sql: |
    # See infra/postgres/init.sql in the repo — copy its contents here,
    # or mount it via a Kustomize configMapGenerator so it stays in sync.
    # (Kept as a pointer to avoid duplicating a large file in two places.)
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: mfe-demo
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          envFrom:
            - secretRef: { name: postgres-credentials }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "postgres"] }
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: init-script
          configMap: { name: postgres-init }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 10Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: mfe-demo
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
  clusterIP: None
