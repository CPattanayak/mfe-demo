apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mfe-demo-qa-ingress
  namespace: mfe-demo-qa
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-staging
    # If a cloud CDN sits in front of this Ingress (recommended for a
    # public-facing QA env), it will typically honor the Cache-Control
    # headers already set by cdn/nginx.conf. Nothing extra is required
    # here beyond making sure the CDN is configured to respect
    # origin cache headers rather than overriding them.
spec:
  tls:
    - hosts:
        - qa.example.com
      secretName: mfe-demo-qa-tls
  rules:
    # Single host, single backend: cdn's nginx (see cdn/nginx.conf)
    # already does all the internal routing — GraphQL to apollo-router,
    # Keycloak auth to keycloak, everything else as static UI assets.
    # The Ingress doesn't need to know any of that; it just needs to get
    # every request to cdn. (Older versions of this file routed
    # /graphql, /realms/**, etc. to separate hosts/backends directly —
    # that predates the reverse-proxy design and is no longer correct.)
    - host: qa.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: cdn, port: { number: 8090 } } }
