# Scrapes hive-gateway's /metrics endpoint (enabled via that service's
# own gateway.config.ts prometheus: {...} block — see
# infra/prometheus/prometheus.yml's identical scrape target, "hive-
# gateway:4000", same Service DNS name pattern used throughout this
# project).
#
# ClusterIP only, no Ingress route — matching the same internal-only
# pattern every backend service in this project already uses. Reach
# this directly for testing via:
#   kubectl port-forward svc/prometheus 9090:9090 -n mfe-demo-qa
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: mfe-demo-qa
data:
  # Populate via:
  #   kubectl create configmap prometheus-config \
  #     --from-file=prometheus.yml=infra/prometheus/prometheus.yml \
  #     -n mfe-demo-qa --dry-run=client -o yaml | kubectl apply -f -
  prometheus.yml: "placeholder"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: mfe-demo-qa
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          ports: [{ containerPort: 9090 }]
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus/prometheus.yml, subPath: prometheus.yml }
          readinessProbe:
            tcpSocket: { port: 9090 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: mfe-demo-qa
spec:
  selector: { app: prometheus }
  ports: [{ port: 9090, targetPort: 9090 }]
