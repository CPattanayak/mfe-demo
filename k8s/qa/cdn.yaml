# Requirement: QA-appropriate replacement for MinIO. Serves the built
# shell / mfe-products / mfe-orders bundles from one nginx "CDN edge"
# origin (image built from ./cdn/Dockerfile), with real immutable-asset
# cache headers instead of a raw object-store bucket. Also the single
# entry point for GraphQL and Keycloak auth — see cdn/nginx.conf's
# reverse-proxy blocks for /graphql and /realms/**.
#
# For an actual hosted QA environment, you'd typically point a real CDN
# (CloudFront / Cloud CDN / Cloudflare) at this Service (or at this
# Deployment's Ingress below) rather than exposing nginx's own cache
# straight to the internet — see the annotations note in ingress.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cdn
  namespace: mfe-demo-qa
spec:
  replicas: 2
  selector:
    matchLabels: { app: cdn }
  template:
    metadata:
      labels: { app: cdn }
    spec:
      containers:
        - name: cdn
          image: ghcr.io/your-org/mfe-cdn:qa
          # Built via:
          #   docker build -f cdn/Dockerfile --build-arg APP_ENV=qa \
          #     --build-arg CDN_PUBLIC_PATH=/ \
          #     --build-arg PRODUCTS_REMOTE_URL=/products/remoteEntry.js \
          #     --build-arg ORDERS_REMOTE_URL=/orders/remoteEntry.js .
          #
          # APP_ENV=qa is NOT optional — this is exactly what selects
          # config.js's "qa" block at build time. Get this wrong (or
          # accidentally reuse a cached layer built with a different
          # APP_ENV) and the bundle silently ships with a DIFFERENT
          # environment's URLs baked in — no build error, just a broken
          # app once deployed. If GraphQL/auth calls mysteriously fail
          # after deploying this image, verify what actually got baked
          # in before assuming the cluster/network is broken:
          #   kubectl exec -it deploy/cdn -n mfe-demo-qa -- \
          #     grep -o 'graphqlUrl:"[^"]*"' /usr/share/nginx/html/*.js
          ports: [{ containerPort: 8090 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 8090 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: cdn
  namespace: mfe-demo-qa
spec:
  selector: { app: cdn }
  ports: [{ port: 8090, targetPort: 8090 }]
