# Copy, rename (drop .example), fill in real QA values, and apply BEFORE
# the other manifests. Use your cluster's secret manager (Sealed Secrets,
# External Secrets Operator, Vault, etc.) instead of plain YAML in any
# environment beyond a personal sandbox.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: mfe-demo-qa
type: Opaque
stringData:
  POSTGRES_DB: appdb
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: CHANGE_ME_QA
  PRODUCT_SERVICE_DB_PASSWORD: CHANGE_ME_QA
  ORDER_SERVICE_DB_PASSWORD: CHANGE_ME_QA
  INVENTORY_SERVICE_DB_PASSWORD: CHANGE_ME_QA
  RATING_SERVICE_DB_PASSWORD: CHANGE_ME_QA
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin
  namespace: mfe-demo-qa
type: Opaque
stringData:
  KEYCLOAK_ADMIN: admin
  KEYCLOAK_ADMIN_PASSWORD: CHANGE_ME_QA
---
apiVersion: v1
kind: Secret
metadata:
  name: openrouter-credentials
  namespace: mfe-demo-qa
type: Opaque
stringData:
  # Powers ai-gateway-service's LangGraph agent — a real OpenRouter
  # account, not something this file can generate. Sign up at
  # https://openrouter.ai/keys.
  OPENROUTER_API_KEY: CHANGE_ME_QA
