# =============================================================================
# SUPERSEDED — DO NOT APPLY. Kept for reference/rollback only.
#
# Was the static-asset store for frontend-deployments.yaml's Deployments
# (also superseded — see that file). cdn.yaml's nginx image now serves
# built assets baked directly into the container instead of reading from
# an object store at runtime, matching the QA topology
# (docker-compose.qa.yml never used MinIO either — see that file's
# comments). If you want a real object-store-backed CDN origin for
# production, that's a legitimate alternative to cdn.yaml's baked-image
# approach, but it isn't what this repo's QA reference implementation
# does, so this file was never updated to match it.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: mfe-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: minio }
  template:
    metadata:
      labels: { app: minio }
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          envFrom:
            - secretRef: { name: minio-credentials }
          ports:
            - { containerPort: 9000, name: api }
            - { containerPort: 9001, name: console }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: minio-data }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: mfe-demo
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 20Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: mfe-demo
spec:
  selector: { app: minio }
  ports:
    - { name: api, port: 9000, targetPort: 9000 }
    - { name: console, port: 9001, targetPort: 9001 }
